# Save as .github/workflows/test-email.yml
# Manual only: Actions tab -> "test-email" -> Run workflow. Tests email and Telegram with your secrets.
name: test-email

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - name: Which channels are configured (values never printed)
        run: |
          python - << 'PY'
          import os
          for k in ("EMAIL_USER","EMAIL_APP_PASSWORD","EMAIL_TO","SMTP_HOST","SMTP_USER","EMAIL_FROM","TG_TOKEN","TG_CHAT"):
              print(f"{k}: {'SET' if os.environ.get(k,'').strip() else 'not set'}")
          PY

      - name: Test email
        continue-on-error: true
        run: |
          python - << 'PY'
          import sys, notify
          ok = notify.send_email("Test email from your job bot",
                                 "If you can read this, email sending from GitHub Actions works.",
                                 "<h3>It works.</h3><p>Email from GitHub Actions is working.</p>")
          sys.exit(0 if ok else "EMAIL TEST FAILED")
          PY

      - name: Test Telegram (skipped if not configured)
        if: env.TG_TOKEN != ''
        run: |
          python - << 'PY'
          import sys, notify
          ok = notify.send_telegram("Test message from your job bot. If you see this, Telegram works.")
          sys.exit(0 if ok else "TELEGRAM TEST FAILED")
          PY
